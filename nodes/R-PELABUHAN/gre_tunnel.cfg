! ==============================================================================
! KONFIGURASI SOAL 6: GRE TUNNEL & BONUS IPSEC PADA R-PELABUHAN
! Kelompok 14 (Mid-Project Jarkom 2026) - NRP: 012, 066, 082
! ==============================================================================
enable
configure terminal
!
! ------------------------------------------------------------------------------
! 1. Konfigurasi Virtual Interface Tunnel0
! ------------------------------------------------------------------------------
interface Tunnel0
 description GRE Tunnel Private Link to R-PUSAT
 ip address 192.168.14.2 255.255.255.252
 tunnel mode gre ip
 tunnel source GigabitEthernet0/0
 tunnel destination 192.112.241.37
 mtu 1476
 no shutdown
exit
!
! ------------------------------------------------------------------------------
! 2. Pengalihan Rute Trafik Balai Kota <-> Pelabuhan Wajib Lewat Tunnel
! ------------------------------------------------------------------------------
! Mengarahkan subnet LAN Balai Kota ke IP next-hop Tunnel R-PUSAT (192.168.14.1)
ip route 192.112.224.0 255.255.248.0 192.168.14.1   ! Pegawai Balai Kota via Tunnel
ip route 192.112.241.0 255.255.255.224 192.168.14.1 ! Server Balai Kota via Tunnel
!
! ------------------------------------------------------------------------------
! 3. BONUS IPsec over GRE (+5 Poin)
! ------------------------------------------------------------------------------
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
exit
!
crypto isakmp key K14SECURE address 192.112.241.37
!
crypto ipsec transform-set TS esp-aes esp-sha-hmac
 mode transport
exit
!
access-list 100 permit gre host 192.112.241.54 host 192.112.241.37
!
crypto map CMAP 10 ipsec-isakmp
 set peer 192.112.241.37
 set transform-set TS
 match address 100
exit
!
! Pasang crypto map ke interface fisik WAN yang mengarah ke R-UTARA (IP 192.112.241.54)
! (Catatan: Ganti GigabitEthernet0/0 jika di topologimu port fisik ke R-UTARA berbeda)
interface GigabitEthernet0/0
 crypto map CMAP
exit
!
end
write memory
