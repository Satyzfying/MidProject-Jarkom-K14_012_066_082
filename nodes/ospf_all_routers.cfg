! ==============================================================================
! SCRIPT SOAL 7: DYNAMIC ROUTING OSPF & LINK CADANGAN L7 (FILE K14_VLSM_OSPF.PKT)
! Kelompok 14 (Mid-Project Jarkom 2026) - NRP: 012, 066, 082
! ==============================================================================
! Catatan Penting:
! 1. Terapkan konfigurasi ini pada file copy kedua: 'result/K14_VLSM_OSPF.pkt'.
! 2. Hapus seluruh static route antar-router (rute LAN cabang) sebelum memasang OSPF.
!    (Pertahankan hanya static route Tunnel0 dan default route R-PUSAT ke R-ISP).
! ==============================================================================

! ==============================================================================
! 1. R-PUSAT (Hub Tengah / Balai Kota)
! ==============================================================================
enable
configure terminal
!
! Hapus static route lama ke LAN cabang (sesuaikan jika ada yang berbeda)
no ip route 192.112.96.0 255.255.224.0 192.112.241.34
no ip route 192.112.239.0 255.255.255.0 192.112.241.34
no ip route 192.112.192.0 255.255.224.0 192.112.241.50
no ip route 192.112.238.0 255.255.255.0 192.112.241.50
no ip route 192.112.0.0 255.255.192.0 192.112.241.38
no ip route 192.112.236.0 255.255.254.0 192.112.241.38
no ip route 192.112.241.52 255.255.255.252 192.112.241.38
no ip route 192.112.128.0 255.255.224.0 192.112.241.46
no ip route 192.112.232.0 255.255.252.0 192.112.241.46
no ip route 192.112.64.0 255.255.224.0 192.112.241.42
no ip route 192.112.240.128 255.255.255.128 192.112.241.42
!
! Konfigurasi OSPF Area 0
router ospf 1
 router-id 1.1.1.1
 ! Pasang passive-interface ke arah LAN pengguna & Server
 passive-interface GigabitEthernet0/1
 passive-interface GigabitEthernet0/2
 ! Iklankan jaringan lokal LAN dan seluruh Link WAN
 network 192.112.224.0 0.0.7.255 area 0    ! Pegawai Balai Kota
 network 192.112.241.0 0.0.0.31 area 0     ! Server Balai Kota
 network 192.112.241.32 0.0.0.3 area 0     ! Link L1 (ke R-DC)
 network 192.112.241.36 0.0.0.3 area 0     ! Link L2 (ke R-UTARA)
 network 192.112.241.40 0.0.0.3 area 0     ! Link L3 (ke R-SELATAN)
 network 192.112.241.44 0.0.0.3 area 0     ! Link L4 (ke R-TIMUR)
 network 192.112.241.48 0.0.0.3 area 0     ! Link L5 (ke R-BARAT)
 ! Injeksi default route internet ke seluruh router OSPF lain
 default-information originate
exit
!
end
write memory


! ==============================================================================
! 2. R-DC (Data Center & Storage + Link L7)
! ==============================================================================
enable
configure terminal
!
! Hapus default route statis lama
no ip route 0.0.0.0 0.0.0.0 192.112.241.33
!
! Konfigurasi Port Link L7 Cadangan ke R-UTARA
! (Catatan: Ganti nama interface jika memakai modul lain, misal GigabitEthernet0/3 atau Serial)
interface GigabitEthernet0/3
 description L7 Backup Link to R-UTARA
 ip address 192.112.241.61 255.255.255.252
 no shutdown
exit
!
router ospf 1
 router-id 2.2.2.2
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
 network 192.112.96.0 0.0.31.255 area 0    ! CCTV Kota
 network 192.112.239.0 0.0.0.255 area 0    ! Server & Storage DC
 network 192.112.241.32 0.0.0.3 area 0     ! Link L1 (ke R-PUSAT)
 network 192.112.241.60 0.0.0.3 area 0     ! Link L7 (ke R-UTARA)
exit
!
end
write memory


! ==============================================================================
! 3. R-UTARA (Wilayah Utara + Link L7)
! ==============================================================================
enable
configure terminal
!
! Hapus rute statis lama
no ip route 0.0.0.0 0.0.0.0 192.112.241.37
no ip route 192.112.160.0 255.255.224.0 192.112.241.54
no ip route 192.112.240.0 255.255.255.128 192.112.241.54
!
! Konfigurasi Port Link L7 Cadangan ke R-DC
interface GigabitEthernet0/2
 description L7 Backup Link to R-DC
 ip address 192.112.241.62 255.255.255.252
 no shutdown
exit
!
router ospf 1
 router-id 4.4.4.4
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
 network 192.112.0.0 0.0.63.255 area 0     ! WiFi Publik Utara
 network 192.112.236.0 0.0.1.255 area 0    ! Sensor Lalu Lintas
 network 192.112.241.36 0.0.0.3 area 0     ! Link L2 (ke R-PUSAT)
 network 192.112.241.52 0.0.0.3 area 0     ! Link L6 (ke R-PELABUHAN)
 network 192.112.241.60 0.0.0.3 area 0     ! Link L7 (ke R-DC)
exit
!
end
write memory


