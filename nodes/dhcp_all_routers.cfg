! ==============================================================================
! KONFIGURASI SOAL 4: DHCP SERVICES PADA SELURUH ROUTER
! Kelompok 14 (Mid-Project Jarkom 2026 - Orang 3 / NRP 082)
! ==============================================================================
! Prinsip:
! 1. Interface router dan seluruh server tetap memakai IP STATIS (di luar pool).
! 2. Perangkat pengguna (PC) mendapat IP dinamis + gateway + DNS 192.112.239.2.
! 3. Blok .1 - .20 di setiap LAN di-exclude agar gateway dan perangkat statis
!    tidak pernah dibagikan oleh DHCP.
! 4. Subnet CCTV Kota (R-DC) TIDAK memakai DHCP router, melainkan DHCP server
!    di LAN Server & Storage DC (192.112.239.2) melalui ip helper-address.
! ==============================================================================

! ------------------------------------------------------------------------------
! 1. R-PUSAT - Pegawai Balai Kota (192.112.224.0/21)
! ------------------------------------------------------------------------------
enable
configure terminal
ip dhcp excluded-address 192.112.224.1 192.112.224.20
ip dhcp pool PEGAWAI-BALAIKOTA
 network 192.112.224.0 255.255.248.0
 default-router 192.112.224.1
 dns-server 192.112.239.2
exit
end
write memory

! ------------------------------------------------------------------------------
! 2. R-UTARA - WiFi Publik Utara (192.112.0.0/18) + Sensor Lalu Lintas (192.112.236.0/23)
! ------------------------------------------------------------------------------
enable
configure terminal
ip dhcp excluded-address 192.112.0.1 192.112.0.20
ip dhcp excluded-address 192.112.236.1 192.112.236.20
ip dhcp pool WIFI-UTARA
 network 192.112.0.0 255.255.192.0
 default-router 192.112.0.1
 dns-server 192.112.239.2
exit
ip dhcp pool SENSOR-LALIN
 network 192.112.236.0 255.255.254.0
 default-router 192.112.236.1
 dns-server 192.112.239.2
exit
end
write memory

! ------------------------------------------------------------------------------
! 3. R-SELATAN - WiFi Publik Selatan (192.112.64.0/19) + PJU Pintar (192.112.240.128/25)
! ------------------------------------------------------------------------------
enable
configure terminal
ip dhcp excluded-address 192.112.64.1 192.112.64.20
ip dhcp excluded-address 192.112.240.129 192.112.240.140
ip dhcp pool WIFI-SELATAN
 network 192.112.64.0 255.255.224.0
 default-router 192.112.64.1
 dns-server 192.112.239.2
exit
ip dhcp pool PJU-SELATAN
 network 192.112.240.128 255.255.255.128
 default-router 192.112.240.129
 dns-server 192.112.239.2
exit
end
write memory

! ------------------------------------------------------------------------------
! 4. R-TIMUR - WiFi Publik Timur (192.112.128.0/19) + Sensor Banjir (192.112.232.0/22)
! ------------------------------------------------------------------------------
enable
configure terminal
ip dhcp excluded-address 192.112.128.1 192.112.128.20
ip dhcp excluded-address 192.112.232.1 192.112.232.20
ip dhcp pool WIFI-TIMUR
 network 192.112.128.0 255.255.224.0
 default-router 192.112.128.1
 dns-server 192.112.239.2
exit
ip dhcp pool SENSOR-BANJIR
 network 192.112.232.0 255.255.252.0
 default-router 192.112.232.1
 dns-server 192.112.239.2
exit
end
write memory

! ------------------------------------------------------------------------------
! 5. R-BARAT - WiFi Publik Barat (192.112.192.0/19) + Puskesmas & Sekolah (192.112.238.0/24)
! ------------------------------------------------------------------------------
enable
configure terminal
ip dhcp excluded-address 192.112.192.1 192.112.192.20
ip dhcp excluded-address 192.112.238.1 192.112.238.20
ip dhcp pool WIFI-BARAT
 network 192.112.192.0 255.255.224.0
 default-router 192.112.192.1
 dns-server 192.112.239.2
exit
ip dhcp pool PUSKESMAS-BARAT
 network 192.112.238.0 255.255.255.0
 default-router 192.112.238.1
 dns-server 192.112.239.2
exit
end
write memory

! ------------------------------------------------------------------------------
! 6. R-PELABUHAN - SCADA Pelabuhan (192.112.160.0/19) + Kantor Pelabuhan (192.112.240.0/25)
! ------------------------------------------------------------------------------
enable
configure terminal
ip dhcp excluded-address 192.112.160.1 192.112.160.20
ip dhcp excluded-address 192.112.240.1 192.112.240.20
ip dhcp pool SCADA-PELABUHAN
 network 192.112.160.0 255.255.224.0
 default-router 192.112.160.1
 dns-server 192.112.239.2
exit
ip dhcp pool KANTOR-PELABUHAN
 network 192.112.240.0 255.255.255.128
 default-router 192.112.240.1
 dns-server 192.112.239.2
exit
end
write memory

! ------------------------------------------------------------------------------
! 7. R-DC - DHCP RELAY untuk CCTV Kota
! Router ini TIDAK membuat pool DHCP. Permintaan DHCP dari LAN CCTV
! (192.112.96.0/19) diteruskan ke server DHCP di LAN Server & Storage DC.
! ------------------------------------------------------------------------------
enable
configure terminal
interface GigabitEthernet0/1
 ip helper-address 192.112.239.2
exit
end
write memory

! ------------------------------------------------------------------------------
! 8. SERVER DAN STORAGE DC 1 (192.112.239.2) - DHCP Server untuk CCTV Kota
! Dikonfigurasi melalui GUI Services > DHCP (bukan CLI):
!   Pool Name : CCTV-KOTA
!   Network   : 192.112.96.0 / 255.255.224.0
!   Gateway   : 192.112.96.1
!   DNS       : 192.112.239.2
!   Start IP  : 192.112.96.100
!   Max Users : 6000  (rentang .100 - .119.211)
! ==============================================================================
