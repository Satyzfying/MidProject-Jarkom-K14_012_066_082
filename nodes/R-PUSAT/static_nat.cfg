! ==============================================================================
! KONFIGURASI SOAL 3 & 5: STATIC ROUTING & NAT OVERLOAD PADA R-PUSAT
! Kelompok 14 - Bagian Satya
! ==============================================================================
enable
configure terminal
!
! 1. IP Uplink ke ISP (Port GigabitEthernet0/0/2)
interface GigabitEthernet0/0/2
 description Uplink to R-ISP
 ip address 203.0.113.57 255.255.255.252
 ip nat outside
 no shutdown
exit
!
! 2. Tandai Interface Lokal sebagai NAT Inside
interface GigabitEthernet0/0
 ip nat inside
exit
interface GigabitEthernet0/1
 ip nat inside
exit
!
! 3. Default Route Arah Keluar ke ISP (Soal 3)
ip route 0.0.0.0 0.0.0.0 203.0.113.58
!
! 4. Static Route ke LAN Cabang (Soal 3)
ip route 192.112.96.0 255.255.224.0 192.112.241.34    ! CCTV Kota (R-DC)
ip route 192.112.239.0 255.255.255.0 192.112.241.34   ! Server DC (R-DC)
ip route 192.112.0.0 255.255.192.0 192.112.241.38     ! WiFi Utara (R-UTARA)
ip route 192.112.236.0 255.255.254.0 192.112.241.38   ! Sensor Lalin (R-UTARA)
ip route 192.112.241.52 255.255.255.252 192.112.241.38! Link L6 ke Pelabuhan
ip route 192.112.64.0 255.255.224.0 192.112.241.42    ! WiFi Selatan (R-SELATAN)
ip route 192.112.240.128 255.255.255.128 192.112.241.42! PJU Selatan (R-SELATAN)
ip route 192.112.128.0 255.255.224.0 192.112.241.46   ! WiFi Timur (R-TIMUR)
ip route 192.112.232.0 255.255.252.0 192.112.241.46   ! Sensor Banjir (R-TIMUR)
ip route 192.112.192.0 255.255.224.0 192.112.241.50   ! WiFi Barat (R-BARAT)
ip route 192.112.238.0 255.255.255.0 192.112.241.50   ! Puskesmas (R-BARAT)
!
! 5. NAT Overload / PAT (Soal 5)
access-list 1 permit 192.112.0.0 0.0.255.255
access-list 1 permit 192.168.14.0 0.0.0.3
ip nat inside source list 1 interface GigabitEthernet0/0/2 overload
!
end
write memory
