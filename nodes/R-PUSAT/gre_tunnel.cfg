! ==============================================================================
! KONFIGURASI SOAL 6: GRE TUNNEL & BONUS IPSEC PADA R-PUSAT
! Kelompok 14 (Mid-Project Jarkom 2026) - NRP: 012, 066, 082
! ==============================================================================
enable
configure terminal
!
! ------------------------------------------------------------------------------
! 1. Konfigurasi Virtual Interface Tunnel0
! ------------------------------------------------------------------------------
interface Tunnel0
 description GRE Tunnel Private Link to R-PELABUHAN
 ip address 192.168.14.1 255.255.255.252
 tunnel mode gre ip
 ! Gunakan IP interface lokal yang mengarah ke R-UTARA atau nama interface fisiknya
 tunnel source 192.112.241.37
 tunnel destination 192.112.241.54
 mtu 1476
 no shutdown
exit
!
! ------------------------------------------------------------------------------
! 2. Pengalihan Rute Trafik Balai Kota <-> Pelabuhan Wajib Lewat Tunnel
! ------------------------------------------------------------------------------
! Mengarahkan subnet LAN Pelabuhan ke IP next-hop Tunnel R-PELABUHAN (192.168.14.2)
ip route 192.112.160.0 255.255.224.0 192.168.14.2   ! SCADA Pelabuhan via Tunnel
ip route 192.112.240.0 255.255.255.128 192.168.14.2 ! Kantor Pelabuhan via Tunnel
!
! ------------------------------------------------------------------------------
! 3. BONUS IPsec over GRE (+5 Poin)
! ------------------------------------------------------------------------------
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
exit
!
crypto isakmp key K14SECURE address 192.112.241.54
!
crypto ipsec transform-set TS esp-aes esp-sha-hmac
 mode transport
exit
!
access-list 100 permit gre host 192.112.241.37 host 192.112.241.54
!
crypto map CMAP 10 ipsec-isakmp
 set peer 192.112.241.54
 set transform-set TS
 match address 100
exit
!
! Pasang crypto map ke interface fisik WAN yang mengarah ke R-UTARA (IP 192.112.241.37)
interface GigabitEthernet0/0/1
 crypto map CMAP
exit
!
end
write memory
